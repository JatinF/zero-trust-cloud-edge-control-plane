# Not applied. kubectl is not installed on the authoring workstation.
# The image name is a label for a later cluster. It was not loaded here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: zero-trust-cloud-edge-control-plane:ci
          args: ["health"]
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - port: 8080
      targetPort: http
