name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
      - run: go test -race -count=1 ./... -timeout 300s
      - run: go vet ./...
      - run: go build -o bin/ ./cmd/...

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t zero-trust-cloud-edge-control-plane:ci .
